<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle / Shield base -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#shieldGrad)" />
  <rect x="6.5" y="6.5" width="51" height="51" rx="14" fill="url(#innerGrad)" />

  <!-- Cybersecurity Shield Outline -->
  <path d="M32 13L18 19.5V31.8C18 42.6 24 50.8 32 54C40 50.8 46 42.6 46 31.8V19.5L32 13Z"
        fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Inner Keyhole / Lock symbol inside Shield -->
  <circle cx="32" cy="29" r="4.5" fill="#FFFFFF"/>
  <path d="M30 31.5H34L35 41.5H29L30 31.5Z" fill="#FFFFFF"/>
  <circle cx="32" cy="29" r="2" fill="#2563EB"/>
</svg>
